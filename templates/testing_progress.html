{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport"

    <title>CALARIT Testing Progress</title>

    <link rel="stylesheet"
          href="{% static 'css/testing_progress.css' %}">

</head>

<body>

<script src="{% static 'js/testing_progress.js' %}"></script>

</html>
